name: Daily Project Update

on:
  schedule:
    - cron: "30 17 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Make daily update
        run: |
          echo "Last automated update: $(date -u)" > DAILY_STATUS.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add DAILY_STATUS.md

          git diff --cached --quiet || git commit -m "chore: daily project update"

          git push
